services:
  db:
    image: postgres:16-alpine
    container_name: inventaris-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-inventaris_db}
      POSTGRES_USER: ${DB_USERNAME:-central_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-central_user} -d ${DB_DATABASE:-inventaris_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - inventaris-net

  api:
    build:
      context: ./backend
    container_name: inventaris-api
    restart: unless-stopped
    environment:
      APP_NAME: Inventaris
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_KEY: ${APP_KEY:-base64:c29tZXNlY3JldGtleWZvcmxvY2FsZGV2ZWxvcG1lbnQxMjM=}
      APP_URL: ${APP_URL:-http://localhost:8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-inventaris_db}
      DB_USERNAME: ${DB_USERNAME:-central_user}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "${API_FORWARD_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - inventaris-net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: inventaris-frontend
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_FORWARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - inventaris-net

volumes:
  pgdata:

networks:
  inventaris-net:
    driver: bridge
